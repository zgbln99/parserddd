# =============================================================================
#  Android APK build — LTS Fleet (Capacitor shell over https://dd.ltslog.de)
#
#  Triggers: push touching android-app/**, manual "Run workflow", or a tag
#  android-v*. Produces an installable APK as a workflow artifact.
#
#  Signing (optional): add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#  KEY_ALIAS, KEY_PASSWORD to get a signed release APK; without them the
#  build falls back to a debug-signed APK (fine for direct installs).
# =============================================================================
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['android-app/**', '.github/workflows/android.yml']
    tags: ['android-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor deps
        run: npm ci || npm install

      - name: Sync native project
        run: npx cap sync android

      - name: Decode keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LTS-Fleet.apk"

      - name: Build debug APK (no keystore)
        if: steps.keystore.outputs.have_keystore == 'false'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LTS-Fleet.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTS-Fleet-apk
          path: ${{ runner.temp }}/LTS-Fleet.apk
          retention-days: 30
