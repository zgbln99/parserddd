<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link niedostepny</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0f2f7; color: #111827;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .box {
            background: #fff; border-radius: 16px; padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; max-width: 420px;
        }
        .icon { font-size: 3em; margin-bottom: 12px; }
        h1 { font-size: 1.3em; font-weight: 700; margin-bottom: 10px; }
        p { color: #6b7280; font-size: 0.95em; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">&#128274;</div>
        <h1>Link niedostepny</h1>
        <p>Ten link do sledzenia trasy jest nieaktywny, zostal wylaczony lub wygasl.
           Skontaktuj sie z nadawca, aby otrzymac aktualny link.</p>
    </div>
</body>
</html>
