<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - DDD Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f0f2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 380px;
            max-width: 94vw;
            text-align: center;
        }
        .login-logo {
            height: 48px;
            margin-bottom: 16px;
        }
        .login-box h1 {
            font-size: 1.3em;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        .login-box .subtitle {
            font-size: 0.82em;
            color: #9ca3af;
            margin-bottom: 28px;
        }
        .login-box input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95em;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.15s;
        }
        .login-box input[type="password"]:focus {
            border-color: #2563eb;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.92em;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }
        .login-box button:hover { background: #1d4ed8; }
        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.82em;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <form class="login-box" method="POST">
        <img src="https://ltslog.de/logo.png" alt="LTS" class="login-logo">
        <h1>Portal DDD</h1>
        <div class="subtitle">Pobrania plikow z tachografu</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <input type="password" name="password" placeholder="Haslo" autofocus required>
        <button type="submit">Zaloguj sie</button>
    </form>
</body>
</html>
