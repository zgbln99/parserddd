<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czytnik kart kierowców DDD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f7;
            --surface: #ffffff;
            --surface-hover: #f8f9fb;
            --border: #e5e7eb;
            --border-light: #f1f3f5;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --blue: #0ea5e9;
            --orange: #f97316;
            --red: #ef4444;
            --amber: #f59e0b;
            --green: #22c55e;
            --slate: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 24px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1560px; margin: 0 auto; padding: 14px 18px; }

        /* Header */
        .top-bar {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 22px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-bar .brand-logo {
            height: 36px;
            object-fit: contain;
        }
        .top-bar h1 { font-size: 1.1em; font-weight: 700; color: var(--text); }
        .top-bar .subtitle { font-size: 0.75em; color: var(--text-muted); font-weight: 400; }
        .top-bar .upload-btn {
            background: var(--primary); color: white;
            padding: 8px 18px; border-radius: 8px;
            font-size: 0.82em; font-weight: 600;
            border: none; cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: none;
        }
        .top-bar .upload-btn:hover { background: var(--primary-dark); }
        #file-input-nav { display: none; }

        /* Upload area */
        .upload-area {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 56px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: #eff4ff;
        }
        .upload-icon {
            width: 56px; height: 56px;
            background: #eff4ff;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            margin-bottom: 14px;
        }
        .upload-area p { color: var(--text-secondary); font-size: 0.9em; margin-bottom: 14px; }
        .upload-area .btn {
            display: inline-block;
            background: var(--primary); color: white;
            padding: 10px 28px; border-radius: 8px;
            font-size: 0.88em; font-weight: 600;
            border: none; cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .upload-area .btn:hover { background: var(--primary-dark); }
        #file-input { display: none; }

        .loading { text-align: center; padding: 48px; display: none; }
        .loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        .loading p { color: var(--text-secondary); font-size: 0.88em; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
            padding: 12px 18px; border-radius: var(--radius-sm);
            margin-bottom: 14px; display: none; font-size: 0.88em;
        }

        .results { display: none; }

        /* Driver card */
        .driver-card {
            background: linear-gradient(135deg, #1e3a5f, #1e40af);
            color: white;
            padding: 16px 22px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .driver-card h2 { font-size: 1.15em; font-weight: 700; }
        .driver-card .detail { opacity: 0.75; font-size: 0.78em; }
        .driver-card .driver-meta { text-align: right; opacity: 0.7; font-size: 0.76em; line-height: 1.7; }

        /* Summary strip — 4 big + 4 small */
        .summary-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .summary-strip-small {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 18px 12px;
            text-align: center;
            box-shadow: var(--shadow);
            border-left: 3px solid var(--accent, var(--border));
        }
        .stat-sm {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 10px 8px;
            text-align: center;
            box-shadow: var(--shadow);
            border-left: 3px solid var(--accent, var(--border));
        }
        .stat-label {
            font-size: 0.65em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .stat-sm .stat-label { font-size: 0.6em; margin-bottom: 2px; }
        .stat-value {
            font-size: 1.6em;
            font-weight: 800;
            color: var(--accent, var(--text));
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .stat-sm .stat-value { font-size: 1.1em; }
        .stat-sub {
            font-size: 0.72em;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .stat-sm .stat-sub { font-size: 0.65em; margin-top: 1px; }

        /* Toolbar */
        .toolbar {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            box-shadow: var(--shadow);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.84em;
        }
        .toolbar label { font-weight: 600; color: var(--text-secondary); font-size: 0.88em; }
        .toolbar input[type="date"] {
            padding: 5px 8px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 0.86em;
            font-family: inherit;
            outline: none;
            color: var(--text);
        }
        .toolbar input[type="date"]:focus { border-color: var(--primary); }
        .toolbar .sep { color: var(--text-muted); }
        .pill {
            padding: 5px 12px; border-radius: 6px; border: none;
            font-size: 0.82em; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.12s;
        }
        .pill-primary { background: var(--primary); color: white; }
        .pill-primary:hover { background: var(--primary-dark); }
        .pill-ghost { background: transparent; color: var(--text-secondary); }
        .pill-ghost:hover { background: var(--surface-hover); }
        .toolbar-spacer { flex: 1; }
        .pill-upload {
            background: var(--surface-hover); color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }
        .pill-upload:hover { background: var(--border); }
        #file-input-toolbar { display: none; }

        /* Table */
        .table-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .table-top {
            padding: 14px 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .table-top h3 { font-size: 0.95em; font-weight: 700; }
        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
        th {
            padding: 10px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.82em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            background: var(--surface);
            position: sticky;
            top: 0;
        }
        td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        tbody tr:hover td { background: var(--surface-hover); }

        .diet-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .diet-tag.yes { background: #dcfce7; color: #16a34a; }
        .diet-tag.no { background: var(--surface-hover); color: var(--text-muted); }

        .c-orange { color: var(--orange); font-weight: 600; }
        .c-red { color: var(--red); font-weight: 600; }
        .c-blue { color: var(--blue); font-weight: 600; }
        .c-primary { color: var(--primary); font-weight: 600; }
        .c-muted { color: var(--text-muted); }
        .c-slate { color: var(--slate); }
        .c-bold { font-weight: 700; color: var(--text); }

        /* Dropbox */
        .dbx-btn {
            background: #0061fe; color: white;
            padding: 7px 14px; border-radius: 8px;
            font-size: 0.8em; font-weight: 600;
            border: none; cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .dbx-btn:hover { background: #004fd4; }
        .dbx-btn.connected { background: #16a34a; }
        .dbx-btn.connected:hover { background: #15803d; }
        .dbx-btn-sm { padding: 5px 12px; font-size: 0.78em; }
        .dbx-btn-outline {
            background: transparent; color: #0061fe;
            border: 1.5px solid #0061fe;
        }
        .dbx-btn-outline:hover { background: #eff4ff; }
        .dbx-btn-danger {
            background: transparent; color: var(--red);
            border: 1.5px solid var(--red);
            padding: 5px 12px; border-radius: 6px;
            font-size: 0.78em; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        .dbx-btn-danger:hover { background: #fef2f2; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 520px;
            max-width: 94vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 { font-size: 1em; font-weight: 700; }
        .modal-close {
            background: none; border: none;
            font-size: 1.3em; cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
        }
        .modal-close:hover { color: var(--text); }
        .modal-breadcrumb {
            padding: 8px 20px;
            font-size: 0.78em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 4px;
            flex-wrap: wrap;
        }
        .modal-breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        .modal-breadcrumb a:hover { text-decoration: underline; }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .file-list { list-style: none; margin: 0; padding: 0; }
        .file-list li {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.88em;
            transition: background 0.1s;
        }
        .file-list li:hover { background: var(--surface-hover); }
        .file-list li.selected { background: #eff4ff; }
        .file-list .icon { font-size: 1.2em; flex-shrink: 0; }
        .file-list .name { flex: 1; font-weight: 500; }
        .file-list .meta { font-size: 0.78em; color: var(--text-muted); }
        .file-list-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88em;
        }

        /* Export modal path input */
        .export-input-group {
            padding: 16px 20px;
        }
        .export-input-group label {
            display: block;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .export-input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.88em;
            font-family: inherit;
            outline: none;
        }
        .export-input-group input:focus { border-color: var(--primary); }
        .export-msg {
            padding: 12px 20px;
            font-size: 0.85em;
            color: var(--green);
            font-weight: 600;
            display: none;
        }

        .shift-time { font-size: 0.82em; }
        .shift-time .d { font-weight: 600; }
        .shift-time .t { color: var(--text-secondary); font-weight: 500; }

        tfoot td {
            font-weight: 700 !important;
            background: #f8f9fb !important;
            border-top: 2px solid var(--border);
            padding: 9px 9px;
        }

        @media (max-width: 1200px) {
            .summary-strip { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 640px) {
            .summary-strip { grid-template-columns: repeat(2, 1fr); }
            .driver-card { flex-direction: column; text-align: center; }
            .driver-card .driver-meta { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <img src="https://ltslog.de/logo.png" alt="LTS" class="brand-logo">
                <div>
                    <h1>Czytnik kart kierowców</h1>
                    <div class="subtitle">Analiza plików DDD</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
                <button class="dbx-btn dbx-btn-sm" id="dbx-connect-btn" onclick="dropboxConnect()">
                    <svg width="16" height="16" viewBox="0 0 43 40" fill="currentColor"><path d="M12.5 0L0 8.1l8.6 6.9 12.5-8.1L12.5 0zm17.9 0L18 8.1l12.5 8.1 8.6-6.9L30.4 0zM0 21.9l12.5 8.1 8.6-6.9-12.5-8.1L0 21.9zm30.4 1.2l-12.5 8.1 8.6 6.9 12.5-8.1-8.6-6.9zM12.5 33.1l8.6 6.9 8.6-6.9-8.6-5.7-8.6 5.7z"/></svg>
                    Dropbox
                </button>
                <button class="upload-btn" id="nav-upload-btn" onclick="document.getElementById('file-input-nav').click()">
                    Wgraj nowy plik
                </button>
            </div>
            <input type="file" id="file-input-nav" accept=".ddd,.DDD">
        </div>

        <div class="upload-area" id="upload-area">
            <div class="upload-icon">&#128194;</div>
            <p>Przeciagnij plik .ddd tutaj lub kliknij aby wybrac</p>
            <button class="btn" onclick="document.getElementById('file-input').click()">Wybierz plik</button>
            <input type="file" id="file-input" accept=".ddd,.DDD">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Przetwarzanie karty kierowcy...</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="results" id="results">
            <div class="driver-card" id="driver-info"></div>
            <div class="summary-strip" id="summary-big"></div>
            <div class="summary-strip-small" id="summary-small"></div>

            <div class="toolbar">
                <label>Zakres:</label>
                <input type="date" id="date-from">
                <span class="sep">—</span>
                <input type="date" id="date-to">
                <button class="pill pill-primary" onclick="applyDateFilter()">Filtruj</button>
                <button class="pill pill-ghost" onclick="resetDateFilter()">Reset</button>
                <div class="toolbar-spacer"></div>
                <button class="pill pill-upload" id="dbx-import-btn" onclick="openDropboxBrowser()" style="display:none;background:#eff4ff;color:#0061fe;border-color:#0061fe">Importuj z Dropbox</button>
                <button class="pill pill-upload" id="dbx-export-btn" onclick="openExportModal()" style="display:none;background:#eff4ff;color:#16a34a;border-color:#16a34a">Eksportuj do Dropbox</button>
                <button class="pill pill-upload" onclick="document.getElementById('file-input-toolbar').click()">Wgraj nowy plik</button>
                <input type="file" id="file-input-toolbar" accept=".ddd,.DDD">
            </div>

            <div class="table-card">
                <div class="table-top">
                    <h3 id="shifts-header">Zmiany</h3>
                </div>
                <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Start</th>
                            <th>Koniec</th>
                            <th>Czas trwania</th>
                            <th>Pojazd</th>
                            <th>Jazda</th>
                            <th>Praca</th>
                            <th>Przerwy</th>
                            <th>Czas pracy</th>
                            <th>25% (dzies.)</th>
                            <th>40% (dzies.)</th>
                            <th>Dieta</th>
                        </tr>
                    </thead>
                    <tbody id="daily-tbody"></tbody>
                    <tfoot id="daily-tfoot"></tfoot>
                </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Dropbox Browser Modal -->
    <div class="modal-overlay" id="dbx-browser-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Importuj z Dropbox</h3>
                <button class="modal-close" onclick="closeModal('dbx-browser-modal')">&times;</button>
            </div>
            <div class="modal-breadcrumb" id="dbx-breadcrumb"></div>
            <div class="modal-body">
                <ul class="file-list" id="dbx-file-list"></ul>
            </div>
            <div class="modal-footer">
                <button class="pill pill-ghost" onclick="closeModal('dbx-browser-modal')">Anuluj</button>
                <button class="dbx-btn dbx-btn-sm" id="dbx-import-confirm" onclick="importSelectedFile()" disabled>Importuj</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="dbx-export-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Eksportuj do Dropbox</h3>
                <button class="modal-close" onclick="closeModal('dbx-export-modal')">&times;</button>
            </div>
            <div class="export-input-group">
                <label>Folder docelowy na Dropbox:</label>
                <input type="text" id="export-path" value="/DDD-Wyniki" placeholder="/DDD-Wyniki">
            </div>
            <div class="export-msg" id="export-msg"></div>
            <div class="modal-footer">
                <button class="pill pill-ghost" onclick="closeModal('dbx-export-modal')">Anuluj</button>
                <button class="dbx-btn dbx-btn-sm" id="dbx-export-confirm" onclick="exportToDropbox()" style="background:#16a34a">Eksportuj CSV</button>
            </div>
        </div>
    </div>

    <!-- Dropbox Account Modal -->
    <div class="modal-overlay" id="dbx-account-modal">
        <div class="modal" style="width:360px">
            <div class="modal-header">
                <h3>Dropbox</h3>
                <button class="modal-close" onclick="closeModal('dbx-account-modal')">&times;</button>
            </div>
            <div style="padding:20px;text-align:center">
                <div style="font-size:2em;margin-bottom:8px">
                    <svg width="40" height="40" viewBox="0 0 43 40" fill="#0061fe"><path d="M12.5 0L0 8.1l8.6 6.9 12.5-8.1L12.5 0zm17.9 0L18 8.1l12.5 8.1 8.6-6.9L30.4 0zM0 21.9l12.5 8.1 8.6-6.9-12.5-8.1L0 21.9zm30.4 1.2l-12.5 8.1 8.6 6.9 12.5-8.1-8.6-6.9zM12.5 33.1l8.6 6.9 8.6-6.9-8.6-5.7-8.6 5.7z"/></svg>
                </div>
                <div id="dbx-account-info" style="margin-bottom:16px"></div>
                <button class="dbx-btn-danger" onclick="dropboxDisconnect()">Rozlacz Dropbox</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInputNav = document.getElementById('file-input-nav');
        const fileInputToolbar = document.getElementById('file-input-toolbar');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const results = document.getElementById('results');
        const navUploadBtn = document.getElementById('nav-upload-btn');

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault(); uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', () => { if (fileInput.files.length > 0) processFile(fileInput.files[0]); });
        fileInputNav.addEventListener('change', () => { if (fileInputNav.files.length > 0) processFile(fileInputNav.files[0]); });
        fileInputToolbar.addEventListener('change', () => { if (fileInputToolbar.files.length > 0) processFile(fileInputToolbar.files[0]); });

        function processFile(file) {
            uploadArea.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            results.style.display = 'none';
            navUploadBtn.style.display = 'none';
            const formData = new FormData();
            formData.append('file', file);
            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.error) { showError(data.error); return; }
                    renderResults(data);
                })
                .catch(err => { loading.style.display = 'none'; showError('Blad: ' + err.message); });
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            uploadArea.style.display = 'block';
        }

        let currentData = null;

        function renderResults(data) {
            currentData = data;
            results.style.display = 'block';
            navUploadBtn.style.display = 'inline-block';

            const di = data.driver_info || {};
            document.getElementById('driver-info').innerHTML = `
                <div>
                    <h2>${di.driver_name || 'Nieznany kierowca'}</h2>
                    <div class="detail">Nr karty: ${di.card_number || '-'}</div>
                </div>
                <div class="driver-meta">
                    ${di.card_issue_date ? `<div>Wydana: ${formatDate(di.card_issue_date)}</div>` : ''}
                    ${di.card_expiry_date ? `<div>Wazna do: ${formatDate(di.card_expiry_date)}</div>` : ''}
                </div>
            `;

            // Only set dates if inputs are empty (don't overwrite user's filter)
            const details = data.shift_details || [];
            const dateFrom = document.getElementById('date-from');
            const dateTo = document.getElementById('date-to');
            if (!dateFrom.value && details.length > 0) {
                dateFrom.value = details[0].shift_date;
            }
            if (!dateTo.value && details.length > 0) {
                dateTo.value = details[details.length - 1].shift_date;
            }

            applyDateFilter();
        }

        function renderFiltered(details) {
            const hm = m => Math.floor(m/60) + ':' + String(m%60).padStart(2,'0');
            const dec = m => (m/60).toFixed(2);

            let totWork=0, totDriving=0, totBreak=0, totN25=0, totN40=0, dietCount=0;
            for (const d of details) {
                totWork += d.work_minutes;
                totDriving += d.driving_minutes;
                totBreak += d.break_minutes;
                totN25 += d.night_25_minutes;
                totN40 += d.night_40_minutes;
                if (d.has_diet) dietCount++;
            }
            const totNight = totN25 + totN40;

            const bigStats = [
                { l:'Czas pracy', v:hm(totWork), s:dec(totWork)+' h', a:'#1e40af' },
                { l:'Nocne 25%', v:dec(totN25)+' h', s:hm(totN25), a:'#f97316' },
                { l:'Nocne 40%', v:dec(totN40)+' h', s:hm(totN40), a:'#ef4444' },
                { l:'Diety', v:dietCount, s:'zmiana > 8h', a:'#22c55e' },
            ];
            const smallStats = [
                { l:'Zmian', v:details.length, s:'', a:'#475569' },
                { l:'Jazda', v:hm(totDriving), s:dec(totDriving)+' h', a:'#0ea5e9' },
                { l:'Przerwy', v:hm(totBreak), s:dec(totBreak)+' h', a:'#64748b' },
                { l:'Nocne razem', v:dec(totNight)+' h', s:hm(totNight), a:'#f59e0b' },
            ];

            document.getElementById('summary-big').innerHTML = bigStats.map(s => `
                <div class="stat" style="--accent:${s.a}">
                    <div class="stat-label">${s.l}</div>
                    <div class="stat-value">${s.v}</div>
                    ${s.s ? `<div class="stat-sub">${s.s}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('summary-small').innerHTML = smallStats.map(s => `
                <div class="stat-sm" style="--accent:${s.a}">
                    <div class="stat-label">${s.l}</div>
                    <div class="stat-value">${s.v}</div>
                    ${s.s ? `<div class="stat-sub">${s.s}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('shifts-header').textContent = `Zmiany (${details.length})`;

            const tbody = document.getElementById('daily-tbody');
            tbody.innerHTML = '';
            for (const d of details) {
                const tr = document.createElement('tr');
                const plates = (d.vehicles || []).join(', ');
                tr.innerHTML = `
                    <td class="shift-time">${fmtDt(d.shift_start)}</td>
                    <td class="shift-time">${fmtDt(d.shift_end)}</td>
                    <td class="c-muted">${d.duration_hm}</td>
                    <td class="c-primary">${plates || '-'}</td>
                    <td class="c-blue">${d.driving_hm}</td>
                    <td>${d.work_only_hm}</td>
                    <td class="c-slate">${d.break_hm}</td>
                    <td class="c-bold">${d.work_hm} <span class="c-muted" style="font-size:0.85em;font-weight:400">(${d.work_decimal}h)</span></td>
                    <td class="c-orange">${d.night_25_minutes > 0 ? dec(d.night_25_minutes) : '-'}</td>
                    <td class="c-red">${d.night_40_minutes > 0 ? dec(d.night_40_minutes) : '-'}</td>
                    <td>${d.has_diet ? '<span class="diet-tag yes">TAK</span>' : '<span class="diet-tag no">-</span>'}</td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById('daily-tfoot').innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:right;color:var(--text-muted)">SUMA</td>
                    <td class="c-blue">${hm(totDriving)}</td>
                    <td></td>
                    <td class="c-slate">${hm(totBreak)}</td>
                    <td class="c-bold">${hm(totWork)} <span class="c-muted" style="font-size:0.85em;font-weight:400">(${dec(totWork)}h)</span></td>
                    <td class="c-orange">${dec(totN25)}</td>
                    <td class="c-red">${dec(totN40)}</td>
                    <td style="color:var(--green);font-weight:700">${dietCount}</td>
                </tr>
            `;
        }

        function applyDateFilter() {
            if (!currentData) return;
            const from = document.getElementById('date-from').value;
            const to = document.getElementById('date-to').value;
            let filtered = currentData.shift_details || [];
            if (from) filtered = filtered.filter(d => d.shift_date >= from);
            if (to) filtered = filtered.filter(d => d.shift_date <= to);
            renderFiltered(filtered);
        }

        function resetDateFilter() {
            if (!currentData) return;
            const details = currentData.shift_details || [];
            if (details.length > 0) {
                document.getElementById('date-from').value = details[0].shift_date;
                document.getElementById('date-to').value = details[details.length - 1].shift_date;
            }
            renderFiltered(details);
        }

        function formatDate(s) {
            if (!s) return '-';
            try { return new Date(s).toLocaleDateString('pl-PL'); } catch { return s; }
        }

        function fmtDt(s) {
            if (!s) return '-';
            const [date, time] = s.split(' ');
            if (!time) return s;
            const p = date.split('-');
            return `<span class="d">${p[2]}.${p[1]}.${p[0]}</span> <span class="t">${time}</span>`;
        }

        // ===== Dropbox Integration =====
        let dbxConnected = false;
        let dbxCurrentPath = '';
        let dbxSelectedFile = null;

        function checkDropboxStatus() {
            fetch('/dropbox/status')
                .then(r => r.json())
                .then(data => {
                    dbxConnected = data.connected;
                    updateDropboxUI(data);
                })
                .catch(() => {});
        }

        function updateDropboxUI(data) {
            const btn = document.getElementById('dbx-connect-btn');
            const importBtn = document.getElementById('dbx-import-btn');
            const exportBtn = document.getElementById('dbx-export-btn');
            if (data.connected) {
                btn.className = 'dbx-btn dbx-btn-sm connected';
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 43 40" fill="currentColor"><path d="M12.5 0L0 8.1l8.6 6.9 12.5-8.1L12.5 0zm17.9 0L18 8.1l12.5 8.1 8.6-6.9L30.4 0zM0 21.9l12.5 8.1 8.6-6.9-12.5-8.1L0 21.9zm30.4 1.2l-12.5 8.1 8.6 6.9 12.5-8.1-8.6-6.9zM12.5 33.1l8.6 6.9 8.6-6.9-8.6-5.7-8.6 5.7z"/></svg> ${data.name || 'Dropbox'}`;
                btn.onclick = () => openModal('dbx-account-modal');
                document.getElementById('dbx-account-info').innerHTML = `
                    <div style="font-weight:700;font-size:1.05em">${data.name}</div>
                    <div style="color:var(--text-muted);font-size:0.85em">${data.email}</div>
                `;
                importBtn.style.display = '';
                exportBtn.style.display = '';
            } else {
                btn.className = 'dbx-btn dbx-btn-sm';
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 43 40" fill="currentColor"><path d="M12.5 0L0 8.1l8.6 6.9 12.5-8.1L12.5 0zm17.9 0L18 8.1l12.5 8.1 8.6-6.9L30.4 0zM0 21.9l12.5 8.1 8.6-6.9-12.5-8.1L0 21.9zm30.4 1.2l-12.5 8.1 8.6 6.9 12.5-8.1-8.6-6.9zM12.5 33.1l8.6 6.9 8.6-6.9-8.6-5.7-8.6 5.7z"/></svg> Dropbox`;
                btn.onclick = dropboxConnect;
                importBtn.style.display = 'none';
                exportBtn.style.display = 'none';
            }
        }

        function dropboxConnect() {
            window.location.href = '/dropbox/auth';
        }

        function dropboxDisconnect() {
            fetch('/dropbox/disconnect')
                .then(() => {
                    dbxConnected = false;
                    closeModal('dbx-account-modal');
                    checkDropboxStatus();
                });
        }

        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        function openDropboxBrowser() {
            dbxSelectedFile = null;
            document.getElementById('dbx-import-confirm').disabled = true;
            openModal('dbx-browser-modal');
            browsePath('');
        }

        function browsePath(path) {
            dbxCurrentPath = path;
            dbxSelectedFile = null;
            document.getElementById('dbx-import-confirm').disabled = true;
            const list = document.getElementById('dbx-file-list');
            list.innerHTML = '<li class="file-list-empty">Ladowanie...</li>';
            updateBreadcrumb(path);

            fetch('/dropbox/browse?path=' + encodeURIComponent(path))
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        list.innerHTML = `<li class="file-list-empty">${data.error}</li>`;
                        return;
                    }
                    const items = data.items || [];
                    const dddItems = items.filter(i => i.type === 'folder' || i.name.toLowerCase().endsWith('.ddd'));
                    if (dddItems.length === 0) {
                        list.innerHTML = '<li class="file-list-empty">Brak plikow .ddd w tym folderze</li>';
                        return;
                    }
                    list.innerHTML = '';
                    for (const item of dddItems) {
                        const li = document.createElement('li');
                        if (item.type === 'folder') {
                            li.innerHTML = `<span class="icon">&#128193;</span><span class="name">${item.name}</span>`;
                            li.onclick = () => browsePath(item.path);
                        } else {
                            const size = item.size ? (item.size / 1024).toFixed(0) + ' KB' : '';
                            li.innerHTML = `<span class="icon">&#128196;</span><span class="name">${item.name}</span><span class="meta">${size}</span>`;
                            li.onclick = () => selectFile(li, item.path);
                        }
                        list.appendChild(li);
                    }
                })
                .catch(err => {
                    list.innerHTML = `<li class="file-list-empty">Blad: ${err.message}</li>`;
                });
        }

        function updateBreadcrumb(path) {
            const bc = document.getElementById('dbx-breadcrumb');
            const parts = path.split('/').filter(Boolean);
            let html = '<a onclick="browsePath(\'\')">Dropbox</a>';
            let curr = '';
            for (const p of parts) {
                curr += '/' + p;
                const pathVal = curr;
                html += ` <span>/</span> <a onclick="browsePath('${pathVal}')">${p}</a>`;
            }
            bc.innerHTML = html;
        }

        function selectFile(li, path) {
            document.querySelectorAll('#dbx-file-list li').forEach(el => el.classList.remove('selected'));
            li.classList.add('selected');
            dbxSelectedFile = path;
            document.getElementById('dbx-import-confirm').disabled = false;
        }

        function importSelectedFile() {
            if (!dbxSelectedFile) return;
            closeModal('dbx-browser-modal');
            uploadArea.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            results.style.display = 'none';
            navUploadBtn.style.display = 'none';

            fetch('/dropbox/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: dbxSelectedFile }),
            })
                .then(r => r.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.error) { showError(data.error); return; }
                    renderResults(data);
                })
                .catch(err => { loading.style.display = 'none'; showError('Blad: ' + err.message); });
        }

        function openExportModal() {
            if (!currentData) return;
            document.getElementById('export-msg').style.display = 'none';
            openModal('dbx-export-modal');
        }

        function exportToDropbox() {
            if (!currentData) return;
            const btn = document.getElementById('dbx-export-confirm');
            const msg = document.getElementById('export-msg');
            btn.disabled = true;
            btn.textContent = 'Eksportowanie...';
            msg.style.display = 'none';

            const from = document.getElementById('date-from').value;
            const to = document.getElementById('date-to').value;
            let filtered = currentData.shift_details || [];
            if (from) filtered = filtered.filter(d => d.shift_date >= from);
            if (to) filtered = filtered.filter(d => d.shift_date <= to);

            fetch('/dropbox/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    driver_name: (currentData.driver_info || {}).driver_name || 'kierowca',
                    shifts: filtered,
                    path: document.getElementById('export-path').value || '/DDD-Wyniki',
                }),
            })
                .then(r => r.json())
                .then(data => {
                    btn.disabled = false;
                    btn.textContent = 'Eksportuj CSV';
                    if (data.error) {
                        msg.style.color = 'var(--red)';
                        msg.textContent = 'Blad: ' + data.error;
                        msg.style.display = 'block';
                    } else {
                        msg.style.color = 'var(--green)';
                        msg.textContent = 'Zapisano: ' + data.path;
                        msg.style.display = 'block';
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.textContent = 'Eksportuj CSV';
                    msg.style.color = 'var(--red)';
                    msg.textContent = 'Blad: ' + err.message;
                    msg.style.display = 'block';
                });
        }

        // Check Dropbox status on load
        checkDropboxStatus();
    </script>
</body>
</html>
