<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czytnik kart kierowców DDD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 1.8em; margin-bottom: 8px; }
        header p { opacity: 0.85; font-size: 0.95em; }

        .upload-area {
            background: white;
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #1a237e;
            background: #f5f5ff;
        }
        .upload-area .icon { font-size: 3em; margin-bottom: 15px; color: #666; }
        .upload-area p { color: #666; margin-bottom: 10px; }
        .upload-area .btn {
            display: inline-block;
            background: #1a237e;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .upload-area .btn:hover { background: #283593; }
        #file-input { display: none; }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1a237e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .results { display: none; }

        .driver-card {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .driver-card h2 { font-size: 1.5em; margin-bottom: 10px; }
        .driver-card .detail { opacity: 0.85; margin-bottom: 4px; font-size: 0.95em; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .summary-card .label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .summary-card .value {
            font-size: 1.8em;
            font-weight: 700;
            color: #1a237e;
        }
        .summary-card .sub {
            font-size: 0.85em;
            color: #888;
            margin-top: 4px;
        }
        .summary-card.night25 .value { color: #e65100; }
        .summary-card.night40 .value { color: #b71c1c; }
        .summary-card.diet .value { color: #2e7d32; }

        .daily-table-wrapper {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        .daily-table-wrapper h3 {
            margin-bottom: 15px;
            color: #1a237e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th {
            background: #f5f5f5;
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        tr:hover td { background: #fafafa; }
        .diet-yes {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        .diet-no {
            color: #999;
            font-size: 0.85em;
        }
        .night-cell { font-weight: 500; }
        .night25-val { color: #e65100; }
        .night40-val { color: #b71c1c; }

        .plate-cell {
            color: #1565c0;
            font-weight: 600;
            font-size: 0.88em;
        }

        .date-filter {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .date-filter label {
            font-weight: 600;
            color: #1a237e;
            font-size: 0.95em;
        }
        .date-filter input[type="date"] {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            outline: none;
        }
        .date-filter input[type="date"]:focus {
            border-color: #1a237e;
        }
        .date-filter .filter-btn {
            background: #1a237e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .date-filter .filter-btn:hover { background: #283593; }
        .date-filter .filter-btn.reset {
            background: #78909c;
        }
        .date-filter .filter-btn.reset:hover { background: #546e7a; }

        .reset-btn {
            display: inline-block;
            background: #78909c;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
            margin-top: 20px;
        }
        .reset-btn:hover { background: #546e7a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Czytnik kart kierowców DDD</h1>
            <p>Wgraj plik karty kierowcy (.ddd) aby zobaczyc podsumowanie czasu pracy</p>
        </header>

        <div class="upload-area" id="upload-area">
            <div class="icon">&#128179;</div>
            <p>Przeciagnij plik .ddd tutaj lub kliknij aby wybrac</p>
            <button class="btn" onclick="document.getElementById('file-input').click()">Wybierz plik</button>
            <input type="file" id="file-input" accept=".ddd,.DDD">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Przetwarzanie karty kierowcy...</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="results" id="results">
            <div class="driver-card" id="driver-info"></div>

            <div class="summary-grid" id="summary-grid"></div>

            <div class="date-filter" id="date-filter">
                <label>Zakres dat:</label>
                <input type="date" id="date-from">
                <span>—</span>
                <input type="date" id="date-to">
                <button class="filter-btn" onclick="applyDateFilter()">Filtruj</button>
                <button class="filter-btn reset" onclick="resetDateFilter()">Resetuj</button>
            </div>

            <div class="daily-table-wrapper">
                <h3>Szczegoly dzienne</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Pojazd</th>
                            <th>Czas pracy</th>
                            <th>Czas pracy (dzies.)</th>
                            <th>Nocne 25%</th>
                            <th>Nocne 40%</th>
                            <th>Dieta</th>
                        </tr>
                    </thead>
                    <tbody id="daily-tbody"></tbody>
                </table>
            </div>

            <button class="reset-btn" onclick="resetView()">Wgraj nowy plik</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const results = document.getElementById('results');

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                processFile(fileInput.files[0]);
            }
        });

        function processFile(file) {
            uploadArea.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            results.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.error) {
                        showError(data.error);
                        return;
                    }
                    renderResults(data);
                })
                .catch(err => {
                    loading.style.display = 'none';
                    showError('Blad polaczenia: ' + err.message);
                });
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            uploadArea.style.display = 'block';
        }

        let currentData = null;

        function renderResults(data) {
            currentData = data;
            results.style.display = 'block';

            // Driver info
            const di = data.driver_info || {};
            document.getElementById('driver-info').innerHTML = `
                <h2>${di.driver_name || 'Nieznany kierowca'}</h2>
                <div class="detail">Nr karty: ${di.card_number || '-'}</div>
                ${di.card_issue_date ? `<div class="detail">Data wydania: ${formatDate(di.card_issue_date)}</div>` : ''}
                ${di.card_expiry_date ? `<div class="detail">Data waznosci: ${formatDate(di.card_expiry_date)}</div>` : ''}
            `;

            // Set date filter defaults
            if (data.daily_details.length > 0) {
                document.getElementById('date-from').value = data.daily_details[0].date;
                document.getElementById('date-to').value = data.daily_details[data.daily_details.length - 1].date;
            }

            renderFiltered(data.daily_details);
        }

        function renderFiltered(details) {
            // Summary
            let totalWork = 0, totalN25 = 0, totalN40 = 0, dietCount = 0;
            for (const d of details) {
                totalWork += d.work_minutes;
                totalN25 += d.night_25_minutes;
                totalN40 += d.night_40_minutes;
                if (d.has_diet) dietCount++;
            }
            const totalNight = totalN25 + totalN40;
            const hm = m => Math.floor(m/60) + ':' + String(m%60).padStart(2,'0');
            const dec = m => (m/60).toFixed(2);

            document.getElementById('summary-grid').innerHTML = `
                <div class="summary-card">
                    <div class="label">Laczny czas pracy</div>
                    <div class="value">${hm(totalWork)}</div>
                    <div class="sub">${dec(totalWork)} h (dziesietnie)</div>
                </div>
                <div class="summary-card night25">
                    <div class="label">Godziny nocne 25%</div>
                    <div class="value">${hm(totalN25)}</div>
                    <div class="sub">${dec(totalN25)} h (dziesietnie) | 22:00-00:00 / 04:00-06:00</div>
                </div>
                <div class="summary-card night40">
                    <div class="label">Godziny nocne 40%</div>
                    <div class="value">${hm(totalN40)}</div>
                    <div class="sub">${dec(totalN40)} h (dziesietnie) | 00:00-04:00</div>
                </div>
                <div class="summary-card">
                    <div class="label">Lacznie godziny nocne</div>
                    <div class="value">${hm(totalNight)}</div>
                    <div class="sub">${dec(totalNight)} h (dziesietnie)</div>
                </div>
                <div class="summary-card diet">
                    <div class="label">Liczba diet</div>
                    <div class="value">${dietCount}</div>
                    <div class="sub">Dni z praca powyzej 8h (z ${details.length} dni)</div>
                </div>
            `;

            // Daily table
            const tbody = document.getElementById('daily-tbody');
            tbody.innerHTML = '';
            for (const d of details) {
                const tr = document.createElement('tr');
                const plates = (d.vehicles || []).join(', ');
                tr.innerHTML = `
                    <td>${formatDate(d.date)}</td>
                    <td class="plate-cell">${plates || '-'}</td>
                    <td><strong>${d.work_hm}</strong> <span style="color:#888;font-size:0.85em">(${d.work_decimal}h)</span></td>
                    <td>${d.work_decimal} h</td>
                    <td class="night-cell night25-val">${d.night_25_hm}</td>
                    <td class="night-cell night40-val">${d.night_40_hm}</td>
                    <td>${d.has_diet ? '<span class="diet-yes">TAK</span>' : '<span class="diet-no">nie</span>'}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function applyDateFilter() {
            if (!currentData) return;
            const from = document.getElementById('date-from').value;
            const to = document.getElementById('date-to').value;
            let filtered = currentData.daily_details;
            if (from) filtered = filtered.filter(d => d.date >= from);
            if (to) filtered = filtered.filter(d => d.date <= to);
            renderFiltered(filtered);
        }

        function resetDateFilter() {
            if (!currentData) return;
            const details = currentData.daily_details;
            if (details.length > 0) {
                document.getElementById('date-from').value = details[0].date;
                document.getElementById('date-to').value = details[details.length - 1].date;
            }
            renderFiltered(details);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('pl-PL');
            } catch {
                return dateStr;
            }
        }

        function resetView() {
            results.style.display = 'none';
            uploadArea.style.display = 'block';
            fileInput.value = '';
        }
    </script>
</body>
</html>
